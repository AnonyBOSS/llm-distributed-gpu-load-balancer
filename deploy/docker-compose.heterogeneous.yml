# Compose override that runs workers with DIFFERENT capacity.
#
# In the default compose all four workers have MAX_CONCURRENT_TASKS=400,
# so round_robin / least_connections / load_aware / power_of_two all produce
# similar distributions -- there's no signal in the choice.
#
# Apply on top of the base file:
#   docker compose -f deploy/docker-compose.yml \
#                  -f deploy/docker-compose.heterogeneous.yml \
#                  up -d --force-recreate
# then:
#   python scripts/heterogeneous_bench.py
#
# Capacities 50 : 100 : 400 : 400 (worker-1 : worker-2 : worker-3 : worker-4),
# 950 in-flight slots in total. Capacity-blind strategies (round_robin,
# least_connections) send each worker ~1/4 of the traffic; capacity-aware
# ones (load_aware, power_of_two) should shift traffic to the larger workers.

services:
  # Sized for the 1000-user benchmark. Workers self-shed (503) past their
  # capacity, so under round_robin the small worker (50 slots) is handed far
  # more than it can hold and sheds the excess; the client retries it.
  worker-1:
    environment:
      MAX_CONCURRENT_TASKS: "50"
      WORKER_ID: gpu-worker-1
      GPU_NAME: NVIDIA-A10-SIM-small
  worker-2:
    environment:
      MAX_CONCURRENT_TASKS: "100"
      WORKER_ID: gpu-worker-2
      GPU_NAME: NVIDIA-A100-SIM-medium
  worker-3:
    environment:
      MAX_CONCURRENT_TASKS: "400"
      WORKER_ID: gpu-worker-3
      GPU_NAME: NVIDIA-H100-SIM-large
  worker-4:
    environment:
      MAX_CONCURRENT_TASKS: "400"
      WORKER_ID: gpu-worker-4
      GPU_NAME: NVIDIA-H100-SIM-large
  master-1:
    environment:
      MAX_CONCURRENT_TASKS: "400"  # tell the master the largest capacity
