# Compose override that runs TWO workers on a CUDA GPU and TWO on CPU.
# All four workers run the real Qwen/Qwen2.5-0.5B-Instruct model.
# Tuned for ~6 GB consumer GPUs (RTX 3060 / 4060).
#
# VRAM math on a 6 GB card (bfloat16):
#   Qwen-0.5B bf16 ~ 0.5 GB weights per worker.
#   Two GPU workers ~ 1.0 GB, leaves ~ 3.7 GB free for KV-cache.
#   CPU workers run independently and use system RAM, not VRAM.
#
# The heterogeneous mix (GPU + CPU) lets load_aware demonstrate
# intelligent routing: fast GPU workers handle the bulk of traffic
# while CPU workers provide overflow capacity.
#
# Apply on top of the base file:
#   docker compose -f deploy/docker-compose.yml \
#                  -f deploy/docker-compose.gpu.yml \
#                  up -d --build
#
# For >12 GB VRAM hardware (A6000, A100), set worker-3 to GPU too by
# adding the same `deploy.resources.reservations.devices` block + LLM_*
# env to it. NVIDIA Container Toolkit / Docker Desktop with WSL2-GPU
# is required either way.

services:

  worker-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gpu
    image: cse354-llm-svc-gpu:latest
    environment:
      LLM_BACKEND: hf
      LLM_MODEL: Qwen/Qwen2.5-0.5B-Instruct
      LLM_DEVICE: auto
      MAX_CONCURRENT_TASKS: "4"
      THREADPOOL_TOKENS: "100"
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 300s

  worker-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gpu
    image: cse354-llm-svc-gpu:latest
    environment:
      LLM_BACKEND: hf
      LLM_MODEL: Qwen/Qwen2.5-0.5B-Instruct
      LLM_DEVICE: auto
      MAX_CONCURRENT_TASKS: "4"
      THREADPOOL_TOKENS: "100"
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 300s

  # Workers 3 & 4 run real Qwen on CPU — independent compute from GPU workers.
  # Slower (~30-60s per request) but produce genuine LLM answers.
  worker-3:
    environment:
      LLM_BACKEND: hf
      LLM_MODEL: Qwen/Qwen2.5-0.5B-Instruct
      LLM_DEVICE: cpu
      MAX_CONCURRENT_TASKS: "4"
    volumes:
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 300s

  worker-4:
    environment:
      LLM_BACKEND: hf
      LLM_MODEL: Qwen/Qwen2.5-0.5B-Instruct
      LLM_DEVICE: cpu
      MAX_CONCURRENT_TASKS: "4"
    volumes:
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 300s

  master-1:
    environment:
      WORKER_HTTP_TIMEOUT_SEC: "120"
      # Real RAG: master loads sentence-transformers/all-MiniLM-L6-v2 (~90 MB)
      # and FAISS-indexes the 16-doc corpus on first call. Adds ~30 s warmup
      # to the first request, ~10-50 ms per call thereafter.
      RAG_USE_STUB: "false"

volumes:
  hf-cache:
